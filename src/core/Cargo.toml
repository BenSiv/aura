[package]
name = "aura"
version = "0.1.0"
description = "Decentralized, private proximity networking app"
authors = ["Ben Sivan <bensiv92@gmail.com>"]
homepage = "https://github.com/BenSiv/auraradar"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31.0", features = ["bundled"] }
libp2p = { version = "0.53", features = ["tcp", "tls", "dns", "noise", "yamux", "quic", "gossipsub", "mdns", "kad", "identify", "macros", "tokio"] }
futures = "0.3"
tokio = { version = "1", features = ["full"] }
fastrand = "2.3"
kzen-paillier = { version = "0.4", default-features = false }
bulletproofs = "4"
merlin = "3"
curve25519-dalek-ng = "4"
curv-kzen = { version = "0.10", default-features = false, features = ["num-bigint"] }
rand = "0.8"
tauri-plugin-notification = "2"

[patch.crates-io]
curv-kzen = { path = "../../dep/curv" }

